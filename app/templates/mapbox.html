    <!-- Main Content with map -->
    <!-- <div class="main-content">
      <div id="map"></div>
    </div> -->
  <script>
    const mapboxToken = "{{ mapbox_token }}";
    mapboxgl.accessToken = mapboxToken;

    var map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [-79.986255, 42.124078], //penn state behrend
      zoom: 12
    });

    // Instead of manually creating markers, we now add a clustered source.
    // https://docs.mapbox.com/mapbox-gl-js/example/cluster-html/
    // "currentImageSize" will be used to adjust the icon size for unclustered points.
    var currentImageSize = 100;

    function addMarkers() {
      // Remove existing layers/source if they exist (this is useful when switching styles)
      if (map.getLayer('clusters')) { map.removeLayer('clusters'); }
      if (map.getLayer('cluster-count')) { map.removeLayer('cluster-count'); }
      if (map.getLayer('unclustered-point')) { map.removeLayer('unclustered-point'); }
      if (map.getSource('images')) { map.removeSource('images'); }

      // Add the GeoJSON source from the /images endpoint with clustering enabled.
      map.addSource('images', {
        type: 'geojson',
        data: '/images',  //gets the images
        cluster: true,
        clusterRadius: 80,
        clusterProperties: {
          count: ['+', 1]
        }
      });

      // Layer for clusters (grouped points)
      map.addLayer({
        id: 'clusters',
        type: 'circle',
        source: 'images',
        filter: ['has', 'point_count'],
        paint: {
          'circle-color': [
            'step',
            ['get', 'point_count'],
            '#51bbd6',
            10,
            '#f1f075',
            30,
            '#f28cb1'
          ],
          'circle-radius': [
            'step',
            ['get', 'point_count'],
            15,
            10,
            20,
            30,
            25
          ]
        }
      });

      // Layer for cluster count labels
      map.addLayer({
        id: 'cluster-count',
        type: 'symbol',
        source: 'images',
        filter: ['has', 'point_count'],
        layout: {
          'text-field': '{point_count_abbreviated}',
          'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
          'text-size': 12
        }
      });

      map.loadImage('/static/map-marker-2-32.png', function (error, image) {
            if (error) throw error;
            map.addImage('custom-marker', image);
      });

      // Layer for individual (unclustered) points.
      map.addLayer({
        id: 'unclustered-point',
        type: 'symbol',
        source: 'images',
        filter: ['!', ['has', 'point_count']],
        layout: {
          'icon-image': 'custom-marker', // Use the custom image instead of marker-15
          'icon-size': currentImageSize / 80  // Adjust size dynamically
        }
      });
      // map.addLayer({
      //   id: 'unclustered-point',
      //   type: 'symbol',
      //   source: 'images',
      //   filter: ['!', ['has', 'point_count']],
      //   layout: {
      //     'icon-image': 'marker-15', // Default Mapbox marker icon
      //     'icon-size': currentImageSize / 50  // Adjust scaling based on slider value
      //   }
      // });

      // Zoom into clusters when clicked.
      map.on('click', 'clusters', function (e) {
        const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
        const clusterId = features[0].properties.cluster_id;
        map.getSource('images').getClusterExpansionZoom(clusterId, function (err, zoom) {
          if (err) return;
          map.easeTo({
            center: features[0].geometry.coordinates,
            zoom: zoom
          });
        });
      });

      // Change the cursor to a pointer when hovering over clusters.
      map.on('mouseenter', 'clusters', function () {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'clusters', function () {
        map.getCanvas().style.cursor = '';
      });

      map.on("click", "unclustered-point", function (e) {
        console.log("Feature Clicked:", e.features[0]);
        console.log("Properties:", e.features[0].properties);

        const coordinates = e.features[0].geometry.coordinates.slice();
        const props = e.features[0].properties;
        // Extract the array [lon, lat]
        const [lon, lat] = e.features[0].geometry.coordinates;

        let popupContent = `<h3>${props.filename || "No Filename"}</h3>
          <p><strong>Latitude, Longitude:</strong> ${lat}, ${lon}</p>
          <p><strong>Predicted Class:</strong> ${props.predicted_class || "Unknown"}</p>
          <p><strong>narrowleaf_cattail_prob:</strong> ${props.narrowleaf_cattail_prob.toFixed(2)|| "0"}</p>
          <p><strong>none_prob:</strong> ${props.none_prob.toFixed(2)|| "0"}</p>
          <p><strong>phragmites_prob:</strong> ${props.phragmites_prob.toFixed(2)|| "0"}</p>
          <p><strong>purple_loosestrife_prob:</strong> ${props.purple_loosestrife_prob.toFixed(2)|| "0"}</p>
          <img src="/getImage/${props.file_id}" 
          alt="${props.filename}" 
          style="max-width: 200px; height: auto; display: block; margin: 10px auto; border-radius: 5px; cursor: pointer;" 
          onclick="showPreview('/getImage/${props.file_id}')">
        `;
        //add into popupcontent if you want
        // <p><strong>MSL Altitude:</strong> ${props.msl_alt ? props.msl_alt + " m" : "N/A"}</p>
            //<p><strong>Yaw:</strong> ${props.yaw ? props.yaw + "°" : "N/A"}</p>
            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(popupContent)
                .addTo(map);
      });


      map.on('mouseenter', 'unclustered-point', function () {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'unclustered-point', function () {
        map.getCanvas().style.cursor = '';
      });
    }
    
    function showPreview(imageUrl) {
    const modal = document.createElement("div");
    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0, 0, 0, 0.8)";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.style.zIndex = "1000";

    const img = document.createElement("img");
    img.src = imageUrl;
    img.style.maxWidth = "90%";
    img.style.maxHeight = "90%";
    img.style.border = "5px solid white";
    img.style.borderRadius = "8px";

    modal.appendChild(img);
    document.body.appendChild(modal);

    modal.onclick = function () {
        document.body.removeChild(modal);
    };
}

    // Switch styles and ensure the markers are re-added after the new style loads.
    function setMapStyle(style) {
      map.setStyle(style);
      map.once('style.load', addMarkers);
    }

    map.on('load', addMarkers);
    map.addControl(new mapboxgl.NavigationControl());

    let inferenceResults = []; // Store inference results globally

async function previewFiles() {
  let files = document.querySelector('input[type=file]').files;
  await handleFiles(files);
}

function updateFileCount() {
    const fileInput = document.getElementById("fileInput");
    const fileCountElement = document.getElementById("fileCount");

    if (!fileInput || !fileCountElement) return;

    fileCountElement.innerText = `Files to Upload: ${fileInput.files.length}`;
}

async function upload() {
    let formData = new FormData();
    let fileInput = document.getElementById("fileInput");
    let files = fileInput.files;

    if (files.length === 0) {
        alert("No files selected. Please choose images first.");
        return;
    }

    for (let i = 0; i < files.length; i++) {
        formData.append("file", files[i]);
    }

    try {
        // upload
        let response = await fetch("/upload_images", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error(`Server error: ${response.statusText}`);
        }

        let saveData = await response.json();
        alert("Upload Results: " + saveData.message);

        fileInput.value = "";
        updateFileCount(); // Refresh file count display

        updateMapMarkers();

    } catch (error) {
        console.error("Error processing images:", error);
        alert("Failed to process images. Check console for details.");
    }
}


document.getElementById("uploadButton").addEventListener("click", function(event) {
    event.preventDefault();
    upload();
});


function updateMapMarkers() {
    if (map.getSource('images')) {
        map.getSource('images').setData('/images');
    } else {
        addMarkers();
    }
}

function previewFiles() {
    let files = document.getElementById("fileInput").files;
    handleFiles(files);
    updateFileCount();
}

function allowDrop(ev) {
    ev.preventDefault();
}

function drop(ev) {
    ev.preventDefault();

    const droppedFiles = ev.dataTransfer.files;
    const fileInput = document.getElementById("fileInput");
    const dataTransfer = new DataTransfer();

    // Keep existing files in the input
    for (let i = 0; i < fileInput.files.length; i++) {
        dataTransfer.items.add(fileInput.files[i]);
    }

    // Add new dropped files
    for (let i = 0; i < droppedFiles.length; i++) {
        dataTransfer.items.add(droppedFiles[i]);
    }

    fileInput.files = dataTransfer.files;
    
    updateFileCount();
}


document.getElementById("fileInput").addEventListener("change", updateFileCount);

  </script>
</body>
