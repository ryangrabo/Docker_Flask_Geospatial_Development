<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    .sidebar {
      height: 100%;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #333;
      padding-top: 20px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar h2 {
      text-align: center;
    }

    .sidebar button {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      background-color: #555;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .sidebar button:hover {
      background-color: #777;
    }

    .main-content {
      margin-left: 270px;
      padding: 20px;
    }

    h1 {
      color: #333;
      text-align: center;
    }

    .image-container {
      background-color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .image-container img {
      width: 100%;
      max-width: 200px;
      height: auto;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
    }

    .buttons form {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-weight: bold;
      font-size: 14px;
    }
    
    .category-btn {
      background-color: #4CAF50;
      color: white;
    }

    .category-btn:hover {
      background-color: #45a049;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #008CBA;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1024px) {
      .main-content {
        margin-left: 220px;
      }
      .sidebar {
        width: 200px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      .main-content {
        margin-left: 0;
        padding: 10px;
      }
      .sidebar button {
        width: 90%;
        margin: 5px 0;
      }
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      text-align: center;
    }

    .modal-content img {
      max-width: 200px;
      margin: 10px;
      border-radius: 8px;
      border: 2px solid #ccc;
    }

    .close {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      color: #888;
    }

    .close:hover {
      color: black;
    }

    td, th {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
  </style>
</head>

<body>
    <!-- Side Bar -->
    <div class="sidebar">
        <h2>Menu</h2>
        <button onclick="location.href='/'">Back to Map</button> 
    </div>

    <!-- Main Content -->
	<div class="main-content">
        <h1>About Us</h1>
      
        <div class="about-us-grid">
          <div class="about-item">
            <img src="image1.jpg" alt="Ryan image">
            <p>Put Ryan about text here</p>
            <a href="https://www.linkedin.com/in/ryangrabowski/">LinkedIn Profile</a>
          </div>
          <div class="about-item">
            <img src="image2.jpg" alt="Joey Image">
            <p>Put Joey about text here</p>
            <a href="https://www.linkedin.com/in/joseph-george-047589223/">LinkedIn Profile</a>
          </div>
          <div class="about-item">
            <img src="image3.jpg" alt="Ziek Image">
            <p>Put Ziek about text here</p>
            <a href="https://www.linkedin.com/in/ezequiel-moreno-5a6588223/">LinkedIn Profile</a>
          </div>
          <div class="about-item">
            <img src="image4.jpg" alt="Landon Image">
            <p>Put Landon about text here</p>
            <a href="https://www.linkedin.com/in/landon-grafton-6aa551303/">LinkedIn Profile</a>
          </div>
        </div>
      </div>

</body>
</html>
