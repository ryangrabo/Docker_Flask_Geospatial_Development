<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Categorize Low Probability Images</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    .sidebar {
      height: 100%;
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #333;
      padding-top: 20px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar h2 {
      text-align: center;
    }

    .sidebar button {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border: none;
      background-color: #555;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    .sidebar button:hover {
      background-color: #777;
    }

    .main-content {
      margin-left: 270px;
      padding: 20px;
    }

    h1 {
      color: #333;
      text-align: center;
    }

    #lowprob-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .image-container {
      background-color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .image-container img {
      width: 100%;
      max-width: 200px;
      height: auto;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
    }

    .buttons form {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 10px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-weight: bold;
      font-size: 14px;
    }

    .category-btn {
      background-color: #4CAF50;
      color: white;
    }

    .category-btn:hover {
      background-color: #45a049;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #008CBA;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 1024px) {
      #lowprob-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .main-content {
        margin-left: 220px;
      }
      .sidebar {
        width: 200px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        height: auto;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }
      .main-content {
        margin-left: 0;
        padding: 10px;
      }
      .sidebar button {
        width: 90%;
        margin: 5px 0;
      }
    }

    @media (max-width: 600px) {
      #lowprob-grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      text-align: center;
    }

    .modal-content img {
      max-width: 200px;
      margin: 10px;
      border-radius: 8px;
      border: 2px solid #ccc;
    }

    .close {
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      color: #888;
    }

    .close:hover {
      color: black;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Menu</h2>
    <button onclick="location.href='/'">Back to Map</button>
    <button onclick="openReferenceModal()">Show Reference Images</button>
    <p id="lowProbNotice">Checking for low probability images...</p>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h1>Categorize Low Probability Images</h1>

    {% if images %}
    <div id="lowprob-grid">
      {% for image in images %}
      <div class="image-container">
        <img src="{{ url_for('main.get_image', file_id=image.file_id) }}" alt="{{ image.filename }}" onclick="showPreview('/getImage/{{ image.file_id }}')">
        <div class="buttons">
          <form method="POST" action="{{ url_for('main.categorize_images') }}">
            <input type="hidden" name="filename" value="{{ image.filename }}">
            <button type="submit" name="category" value="phragmites" class="category-btn">Phragmites</button>
            <button type="submit" name="category" value="narrowleaf_cattail" class="category-btn">Narrowleaf Cattail</button>
            <button type="submit" name="category" value="purple_loosestrife" class="category-btn">Purple Loosestrife</button>
            <button type="submit" name="category" value="none" class="category-btn">Native Plant</button>
          </form>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
      <p style="text-align:center;">No low probability images to review.</p>
    {% endif %}

    <a href="{{ url_for('main.index') }}">&larr; Back to Map</a>
  </div>

 <!-- Reference Modal -->
<div id="referenceModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeReferenceModal()">&times;</span>
    <h2>Plant Reference Images</h2>
    <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 20px;">
      <div>
        <img
          src="{{ url_for('static', filename='phragmites-example.jpg') }}"
          alt="Phragmites"
          style="max-width: 250px; border-radius: 8px; border: 2px solid #ccc; cursor: pointer;"
          onclick="showPreview(src)"
        >
        <p style="margin-top: 8px; font-weight: bold;">Phragmites</p>
      </div>
      <div>
        <img
          src="{{ url_for('static', filename='narrowleaf-cattail-example.png') }}"
          alt="Narrowleaf Cattail"
          style="max-width: 250px; border-radius: 8px; border: 2px solid #ccc; cursor: pointer;"
          onclick="showPreview(src)"
        >
        <p style="margin-top: 8px; font-weight: bold;">Narrowleaf Cattail</p>
      </div>
      <div>
        <img
          src="{{ url_for('static', filename='purple-loosestrife-example.png') }}"
          alt="Purple Loosestrife"
          style="max-width: 250px; border-radius: 8px; border: 2px solid #ccc; cursor: pointer;"
          onclick="showPreview(src)"
        >
        <p style="margin-top: 8px; font-weight: bold;">Purple Loosestrife</p>
      </div>
    </div>
  </div>
</div>



  <script>
    async function fetchLowProbCount() {
      try {
        const response = await fetch('/numLowProbimages');
        const data = await response.json();
        const count = data.num_low_prob;
        const notice = document.getElementById('lowProbNotice');

        if (count > 0) {
          notice.innerHTML = `<strong>${count}</strong> low confidence images left`;
        } else {
          notice.innerHTML = "No low confidence images to review.";
        }
      } catch (err) {
        document.getElementById('lowProbNotice').innerText = "Error checking low probability images.";
        console.error(err);
      }
    }

    function showPreview(imageUrl) {
      const modal = document.createElement("div");
      modal.style.position = "fixed";
      modal.style.top = "0";
      modal.style.left = "0";
      modal.style.width = "100%";
      modal.style.height = "100%";
      modal.style.background = "rgba(0, 0, 0, 0.8)";
      modal.style.display = "flex";
      modal.style.alignItems = "center";
      modal.style.justifyContent = "center";
      modal.style.zIndex = "1000";

      const img = document.createElement("img");
      img.src = imageUrl;
      img.style.maxWidth = "90%";
      img.style.maxHeight = "90%";
      img.style.border = "5px solid white";
      img.style.borderRadius = "8px";

      modal.appendChild(img);
      document.body.appendChild(modal);

      modal.onclick = function () {
        document.body.removeChild(modal);
      };
    }

    function openReferenceModal() {
      document.getElementById('referenceModal').style.display = 'block';
    }

    function closeReferenceModal() {
      document.getElementById('referenceModal').style.display = 'none';
    }

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('referenceModal');
      if (event.target === modal) {
        closeReferenceModal();
      }
    }

    fetchLowProbCount();
  </script>
</body>
</html>
