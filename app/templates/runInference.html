<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Run Inference on Images</title>
    <style>
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }
        .result-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px;
            background-color: #f9f9f9;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
        }
        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        .preview-image {
            max-width: 90%;
            max-height: 90%;
        }
        #saveAllButton {
            display: none;
            margin-top: 10px;
        }
        /*For the inference results*/
        #results {
    display: grid;
    grid-template-columns: repeat(7, 1fr); /* 4 columns */
    gap: 20px;
    margin-top: 20px;
}

.result-item {
    border: 1px solid #ddd;
    padding: 10px;
    background-color: #f9f9f9;
    text-align: center;
    border-radius: 8px;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
}

.result-item img {
    width: 100%; 
    max-width: 200px;
    height: auto;
    border-radius: 5px;
    cursor: pointer;
}

@media (max-width: 1024px) {
    #results {
        grid-template-columns: repeat(2, 1fr); /* 2 columns for smaller screens */
    }
}

@media (max-width: 600px) {
    #results {
        grid-template-columns: repeat(1, 1fr); /* 1 column on mobile */
    }
}
/*For the uploaded images*/
#preview {
    display: grid;
    grid-template-columns: repeat(7, 1fr); /* 7 columns */
    gap: 10px;
    margin-top: 20px;
}

.preview-item {
    text-align: center;
    border: 1px solid #ddd;
    padding: 10px;
    background-color: #f9f9f9;
    border-radius: 8px;
}

.preview-item img {
    width: 100%;
    max-width: 150px;
    height: auto;
    border-radius: 5px;
    cursor: pointer;
}

@media (max-width: 1200px) {
    #preview {
        grid-template-columns: repeat(4, 1fr); /* 4 columns for medium screens */
    }
}

@media (max-width: 768px) {
    #preview {
        grid-template-columns: repeat(2, 1fr); /* 2 columns for smaller screens */
    }
}

@media (max-width: 500px) {
    #preview {
        grid-template-columns: repeat(1, 1fr); /* 1 column for mobile */
    }
}
/* Sidebar Navigation */
.sidebar {
    height: 100%;
    width: 250px;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #333;
    padding-top: 20px;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.sidebar h2 {
    text-align: center;
}

.sidebar button {
    width: 80%;
    padding: 10px;
    margin: 10px 0;
    font-size: 16px;
    border: none;
    background-color: #555;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

.sidebar button:hover {
    background-color: #777;
}

/* Main Content Adjustments */
.main-content {
    margin-left: 270px;
    padding: 20px;
}

@media (max-width: 768px) {
    .sidebar {
        width: 200px;
    }
    .main-content {
        margin-left: 220px;
    }
}

    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Menu</h2>
        <button onclick="location.href='/'">Back to map</button>
        <button onclick="document.getElementById('fileInput').click()">Choose Files</button>
        <input type="file" id="fileInput" name="file" multiple onchange="previewFiles()" style="display: none;">
        <button onclick="selectAllFiles()">Select All Files</button>
        <button id="runInferenceButton">Run Inference</button>
        <button id="saveAllButton" onclick="saveResults()">Save Selected to Database</button>
    </div>

    <div class="main-content">
        <h1>Run Inference on Images</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <div id="preview"></div>
        </form>

        <div id="results"></div>
    </div>

    <div id="imageModal" class="modal"></div>

    <script>
        let inferenceResults = []; // Store inference results globally

        function previewFiles() {
    let preview = document.getElementById('preview');
    let files = document.querySelector('input[type=file]').files;
    preview.innerHTML = '';

    Array.from(files).forEach(file => {
        if (/\.(jpe?g|png|gif)$/i.test(file.name)) {
            let reader = new FileReader();
            reader.onload = function (e) {
                let div = document.createElement('div');
                div.className = "preview-item";
                div.innerHTML = `
                    <img src="${e.target.result}" onclick="showPreview('${e.target.result}')">
                    <p>${file.name}</p>
                `;
                preview.appendChild(div);
            };
            reader.readAsDataURL(file);
        }
    });
}


        function showPreview(imageUrl) {
    const modal = document.createElement("div");
    modal.style.position = "fixed";
    modal.style.top = "0";
    modal.style.left = "0";
    modal.style.width = "100%";
    modal.style.height = "100%";
    modal.style.background = "rgba(0, 0, 0, 0.9)";
    modal.style.display = "flex";
    modal.style.alignItems = "center";
    modal.style.justifyContent = "center";
    modal.style.zIndex = "1000";

    const img = document.createElement("img");
    img.src = imageUrl;
    img.style.width = "90vw"; 
    img.style.height = "90vh"; 
    img.style.objectFit = "contain"; 
    img.style.border = "5px solid white";
    img.style.borderRadius = "8px";
    img.style.cursor = "pointer";

    modal.appendChild(img);
    document.body.appendChild(modal);

    modal.onclick = function () {
        document.body.removeChild(modal);
    };
}


        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        function zoomIn() {
            let modalImg = document.getElementById("modalImage");
            modalImg.style.width = (modalImg.clientWidth + 100) + "px";
        }

        function zoomOut() {
            let modalImg = document.getElementById("modalImage");
            modalImg.style.width = (modalImg.clientWidth - 100) + "px";
        }

        function selectAllFiles() {
            document.querySelectorAll(".save-checkbox").forEach(cb => cb.checked = true);
        }

        async function runInference() {
    let formData = new FormData();
    let files = document.getElementById("fileInput").files;

    if (files.length === 0) {
        alert("No files selected. Please choose images first.");
        return;
    }

    for (let i = 0; i < files.length; i++) {
        formData.append("file", files[i]);  // Append files correctly
    }

    try {
        let response = await fetch("/runInference", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error(`Server error: ${response.statusText}`);
        }

        let data = await response.json();
        let resultContainer = document.getElementById("results");
        resultContainer.innerHTML = `<h3>Inference Results</h3>`;

        if (data.error) {
            resultContainer.innerHTML += `<p style="color: red;">Error: ${data.error}</p>`;
            return;
        }

        inferenceResults = data.results;
        resultContainer.innerHTML += `<p><strong>Total Processing Time:</strong> ${data.elapsed_time} seconds</p>`;

    let gridHTML = "";
    data.results.forEach((result, index) => {
        gridHTML += `
            <div class="result-item">
                        <input type="checkbox" class="save-checkbox" value="${index}">
                        <p><strong>Total Inference Time:</strong> ${result.total_inference_time.toFixed(4)} milliseconds</p>
                        <p><strong>Filename:</strong> ${result.filename|| "N/A"}</p>
                        <p><strong>Predicted Class:</strong> ${result.predicted_class|| "N/A"}</p>
                        <p><strong>narrowleaf_cattail_prob:</strong> ${result.narrowleaf_cattail_prob.toFixed(4)|| "N/A"}</p>
                        <p><strong>none_prob:</strong> ${result.none_prob.toFixed(4)|| "N/A"}</p>
                        <p><strong>phragmites_prob:</strong> ${result.phragmites_prob.toFixed(4)|| "N/A"}</p>
                        <p><strong>purple_loosestrife_prob:</strong> ${result.purple_loosestrife_prob.toFixed(4)|| "N/A"}</p>
                        <img src="/getImage/${result.file_id}" alt="Inference Image" onclick="showPreview('/getImage/${result.file_id}')">
                    </div>
        `;
    });

    resultContainer.innerHTML += `<div id="results">${gridHTML}</div>`;
        document.getElementById("saveAllButton").style.display = "block";

    } catch (error) {
        console.error("Error during inference:", error);
        alert("Failed to run inference. Check console for details.");
    }
}

/*
"narrowleaf_cattail_prob": properties.get("narrowleaf_cattail_prob"),
                "none_prob": properties.get("none_prob"),
                "phragmites_prob": properties.get("phragmites_prob"),
                "purple_loosestrife_prob": properties.get("purple_loosestrife_prob"),
*/
async function saveResults() {
    let selectedIndexes = [...document.querySelectorAll(".save-checkbox:checked")].map(cb => parseInt(cb.value));
    
    if (selectedIndexes.length === 0) {
        alert("No images selected. Please select images before saving.");
        return;
    }

    let selectedResults = selectedIndexes.map(i => inferenceResults[i]);
    
    if (selectedResults.length === 0) {
        alert("No valid results found. Ensure inference was run successfully.");
        return;
    }

    console.log("Saving results:", selectedResults);  // Debugging log

    try {
        let response = await fetch("/saveResults", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ results: selectedResults })
        });

        if (!response.ok) {
            throw new Error(`Server error: ${response.statusText}`);
        }

        let data = await response.json();
        alert("Successfully saved to database: " + data.message);
    } catch (error) {
        console.error("Error saving results:", error);
        alert("Failed to save results. Check console for details.");
    }
}


        document.getElementById("uploadForm").onsubmit = runInference;
    document.getElementById("runInferenceButton").addEventListener("click", function(event) {
    event.preventDefault();
    runInference();
});

    </script>
</body>
</html>
